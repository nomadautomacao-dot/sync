<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!--
    Rocha Prime "P" brand mark
    Hexagonal shape with chevron cutout
    Navy: #1B2A4A
  -->
  <!-- Top hexagonal block -->
  <path d="
    M 60 0
    L 180 0
    Q 195 0 200 14
    L 200 120
    Q 200 132 190 140
    L 110 195
    Q 100 202 90 195
    L 60 175
    L 60 0
    Z
  " fill="#1B2A4A"/>

  <!-- Bottom left leg of the P -->
  <path d="
    M 60 0
    L 20 0
    Q 0 0 0 20
    L 0 200
    Q 0 215 10 222
    L 45 240
    Q 56 245 60 234
    L 60 0
    Z
  " fill="#1B2A4A"/>

  <!-- White chevron/arrow -->
  <path d="
    M 70 70
    L 145 120
    L 70 170
    Z
  " fill="#FFFFFF"/>
</svg>
