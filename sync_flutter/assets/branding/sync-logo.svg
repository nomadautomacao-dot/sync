<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230">
  <defs>
    <filter id="dropShadow" x="-15%" y="-20%" width="150%" height="180%">
      <feDropShadow
        dx="2"
        dy="3"
        stdDeviation="2.5"
        flood-color="#000000"
        flood-opacity="0.8"
      />
    </filter>
    <filter id="lightGlow" x="-25%" y="-35%" width="170%" height="190%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#lightGlow)" transform="translate(20 0)">
    <line
      x1="36"
      y1="104"
      x2="126"
      y2="104"
      stroke="#ffffff"
      stroke-width="1.4"
      stroke-linecap="round"
      opacity="0.42"
    />
    <line x1="144" y1="104" x2="258" y2="104" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <path
      d="M 112 34 L 258 104 L 112 182"
      fill="none"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <path
      d="M 112 34 L 138 104 L 112 182"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <circle cx="138" cy="104" r="10" fill="#14151a" stroke="#ffffff" stroke-width="2.2" />
    <circle cx="138" cy="104" r="3.2" fill="#ffffff" />
  </g>

  <text
    x="310"
    y="114"
    font-family="'Orbitron', 'Montserrat', 'Arial Extended', 'Segoe UI', Arial, sans-serif"
    font-weight="700"
    font-size="92"
    letter-spacing="20"
    fill="#ffffff"
    filter="url(#dropShadow)"
  >
    SYNC
  </text>

  <text
    x="284"
    y="170"
    font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', Helvetica, sans-serif"
    font-weight="300"
    font-size="17"
    letter-spacing="3.6"
    fill="#a0a4ab"
  >
    PROJECT MANAGEMENT PLATFORM
  </text>
</svg>
