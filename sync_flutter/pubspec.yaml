name: sync_flutter
description: Base Flutter para espelhar o sistema Sync hoje implementado em TSX.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  archive: ^4.0.9
  cloud_firestore: ^6.7.1
  file_picker: ^11.0.2
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_storage: ^13.4.5
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  http: ^1.2.2
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.12
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/censo_matriculas.json
    - assets/ideb_historico.json
    # Os geradores de PDF carregam TTFs via rootBundle (pw.Font.ttf), entao o
    # diretorio inteiro precisa ir no bundle, nao so as familias declaradas.
    - assets/fonts/
  fonts:
    # UI — Instrument Sans (substitui Inter no redesign "Console Tecnico")
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-400.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-500.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-600.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-700.ttf
          weight: 700
    # Dados — IBM Plex Mono, tabular, para todo numero e rotulo tecnico
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-600.ttf
          weight: 600
