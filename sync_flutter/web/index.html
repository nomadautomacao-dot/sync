<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    Global Sync — Plataforma de gestão municipal e empresarial.
    Base href será substituído pelo flutter build --base-href.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Global Sync — Plataforma de gestão municipal e empresarial integrada.">
  <meta name="theme-color" content="#049598">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Global Sync">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Global Sync</title>
  <link rel="manifest" href="manifest.json">

  <!-- O PNG da marca aparece no boot; sem preload ele decodifica depois do
       texto e da um pop-in no meio do fade de entrada. -->
  <link rel="preload" as="image" href="assets/assets/branding/global-sync-icon.png">

  <style>
    /* Primeiro frame na cor da tela que vai aparecer. Antes era #0d1117, um
       quase-preto fora da paleta: o usuario via meio segundo de tela morta
       escura e entao um flash claro. */
    html, body {
      margin: 0;
      height: 100%;
      background-color: #E6F1F3;
    }

    /* Marca estatica durante o download do bundle (~4 MB). Fica na mesma
       posicao do layout Flutter, entao a troca e imperceptivel. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease-out;
    }
    #boot img { width: 84px; height: 84px; }
    #boot .nome {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.8px;
      color: #111827;
    }
    #boot .barra {
      width: 132px;
      height: 2px;
      border-radius: 2px;
      background: #CFE3E4;
      overflow: hidden;
    }
    #boot .barra::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #049598;
      animation: desliza 1.1s ease-in-out infinite;
    }
    @keyframes desliza {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .barra::after { animation: none; width: 100%; opacity: .6; }
    }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <img src="assets/assets/branding/global-sync-icon.png" alt="" width="84" height="84">
    <div class="nome">Global Sync</div>
    <div class="barra"></div>
    <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Carregando o Global Sync</span>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var boot = document.getElementById("boot");
      if (!boot) return;
      boot.style.opacity = "0";
      setTimeout(function () { boot.remove(); }, 320);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
