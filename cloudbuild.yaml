# Pipeline de producao: push na main -> testes -> build -> deploy no Cloud Run.
# Os passos rodam em sequencia; se algum sai com codigo != 0, o build aborta e a
# producao permanece na revisao anterior.

steps:
  # 1. Gate de testes. Roda antes de qualquer coisa ser publicada: um commit que
  #    quebra a suite nunca chega ao Cloud Run.
  - name: 'node:22-slim'
    id: 'test'
    entrypoint: 'bash'
    env:
      # A maquina tem 8 GB e a suite carrega 156 MB de JSON de `data/` — quatro
      # arquivos de 19 MB so do Censo INEP, cada um virando objeto JS varias
      # vezes maior. O Vitest, no padrao, abre um processo por CPU: oito copias
      # disso nao cabem, e o passo morria com `Killed`, exit 137.
      #
      # A variavel e `VITEST_MAX_WORKERS`, lida nativamente pelo Vitest 4 e
      # repassada a `maxWorkers` em `vitest.config.ts`. **Nao troque por
      # `VITEST_MAX_FORKS`**: esse era o nome antigo, casado com
      # `poolOptions.forks.maxForks`, e o Vitest 4 removeu `poolOptions`. Com o
      # nome antigo o limite e lido, montado e descartado em silencio — a suite
      # segue abrindo um processo por CPU e o passo continua morrendo, que foi
      # exatamente o que aconteceu no primeiro conserto.
      #
      # Medido em 2026-08-05, mesma suite, maquina de 10 nucleos:
      #   sem limite efetivo ... 16 processos, 6.366 MB — nao cabe
      #   VITEST_MAX_WORKERS=1 .. 1 processo,  4.886 MB — cabe, 37s
      #
      # Em 2026-08-06 os JSON sairam do `import` (`core/lib/dados-arquivo.ts`) e
      # o peso caiu: a mesma suite passou a 1.508 MB com um processo, e 2.502 MB
      # com paralelismo total — folga de 3x sobre os 8 GB. O limite de 1 deixou
      # de ser necessario e custava tempo: 14s contra 3s.
      #
      # Quatro, e nao solto: o modo de falha que congelou a producao por quatro
      # dias foi um estouro de memoria silencioso. Numero explicito mantem o
      # teto previsivel se `data/` voltar a crescer, e ainda entrega quase toda
      # a velocidade.
      #
      # O heap **nao e a alavanca**: quando o peso estava no `import`, baixa-lo
      # de 6144 para 3072 mudou o pico em 63 MB. Quem decide e o numero de
      # processos e o que entra no grafo de tipos.
      - 'VITEST_MAX_WORKERS=4'
      - 'NODE_OPTIONS=--max-old-space-size=4096'
    args:
      - '-c'
      - |
        set -e
        echo "VITEST_MAX_WORKERS=${VITEST_MAX_WORKERS:-<nao definida>}"
        echo "memoria disponivel:"; free -g || true
        npm ci
        npm test
    timeout: '900s'

  # 2. Build da imagem
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args: ['build', '--build-arg', 'NODE_OPTIONS=--max-old-space-size=4096', '-t', 'gcr.io/$PROJECT_ID/sync-app:${BUILD_ID}', '-t', 'gcr.io/$PROJECT_ID/sync-app:latest', '.']
    # 2400s, e nao 1800s: este e o unico passo de CPU cheia, e desde
    # 2026-08-26 ele roda na maquina padrao, de dois nucleos. Os 1800s davam
    # 4,8x sobre os 375s medidos com oito nucleos; com dois, essa folga cairia
    # para ~1,6x. Estouro de teto aqui nao aparece como defeito: o build morre,
    # a revisao anterior continua respondendo, e "esta no ar" fica
    # indistinguivel de "seu commit esta no ar" — foi assim que a producao ficou
    # parada de 2 a 5 de agosto.
    timeout: '2400s'

  # 3. Push da imagem para o Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args: ['push', 'gcr.io/$PROJECT_ID/sync-app:${BUILD_ID}']

  # 4. Deploy no Cloud Run. As variaveis de ambiente ja configuradas no servico
  #    sao preservadas (o deploy so troca a imagem).
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    args:
      - 'run'
      - 'deploy'
      - 'sync-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sync-app:${BUILD_ID}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '900'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'

  # 5. Smoke test pos-deploy. Emite um Raio-X de verdade contra a revisao que
  #    acabou de subir e confere o que o `npm test` nao ve: se as fontes vivas
  #    (APIs publicas de governo) responderam, se o PDF saiu com as 41 folhas
  #    contratadas e se nenhuma pagina transbordou.
  #
  #    ATENCAO — este passo NAO e um gate: ele roda *depois* do deploy, entao
  #    quando falha a revisao nova ja esta recebendo trafego. O que ele da e
  #    aviso rapido; a reversao e manual, e o proprio script imprime o comando:
  #
  #      gcloud run services update-traffic sync-app \
  #        --to-revisions=<revisao-anterior>=100 --region=us-central1
  #
  #    `--producao` e o consentimento explicito de gerar um relatorio real
  #    contra o ambiente de producao. Fora do CI o script se recusa a fazer
  #    isso sem a flag, porque cada execucao dispara dezenas de chamadas a
  #    APIs publicas de terceiros.
  #
  #    O node_modules vem do passo `test` (mesmo /workspace), entao nao ha
  #    `npm ci` aqui — `tsx` ja esta instalado como devDependency.
  - name: 'node:22-slim'
    id: 'smoke'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        npx tsx scripts/smoke/run.ts "${_SERVICE_URL}" --producao
    timeout: '900s'

# URL do servico. Fica como substituicao para que o smoke test possa ser
# apontado a outro ambiente sem editar o pipeline.
substitutions:
  _SERVICE_URL: 'https://sync-app-n7cfomhaaq-uc.a.run.app'

# Store images
images:
  - 'gcr.io/$PROJECT_ID/sync-app:${BUILD_ID}'
  - 'gcr.io/$PROJECT_ID/sync-app:latest'

# Teto global do build (testes + build da imagem + deploy + smoke test).
# Soma dos tetos por passo: 900 (test) + 2400 (build) + push/deploy + 900
# (smoke). Ele acompanha essa soma: se um teto por passo subir e este ficar
# para tras, o passo mais lento e cortado pelo teto global antes de bater no
# proprio, e a mensagem culpa o build inteiro em vez do passo que demorou.
timeout: '5100s'

options:
  # **Sem `machineType`, de proposito** — e a linha mais barata do arquivo.
  #
  # Escolher uma maquina explicita abre mao dos 2.500 minutos gratuitos por mes
  # que o Google da na maquina padrao. A padrao (`e2-standard-2`) tem **os
  # mesmos 8 GB** da `E2_HIGHCPU_8` que estava aqui: muda o numero de nucleos,
  # nao a memoria — e memoria era o unico motivo de ter escolhido a outra.
  #
  # So deu para tirar depois que os JSON sairam do `import` em 2026-08-06. Antes
  # disso a suite pedia 4.886 MB e o `next build` somava 8.519 MB, e nada cabia
  # em maquina nenhuma; os oito nucleos eram muleta para um problema que estava
  # no `resolveJsonModule`. Hoje a suite pica em 2.502 MB com quatro processos.
  #
  # Medido no build 22332f17 (2026-08-26), ainda na E2_HIGHCPU_8:
  #   test 54s · build 375s · push 49s · deploy 30s · smoke 47s — 9,3 min
  # Com dois nucleos em vez de oito o gargalo e o passo `build`, que e o unico
  # de CPU cheia. Mesmo a 3x ele fica em ~19 min, e ~25 min de build inteiro
  # cabem folgados nos 2.500 minutos: sao 100 builds por mes, e fazemos ~15.
  #
  # Guardado do que veio antes: **`E2_HIGHCPU_32` nao esta disponivel** — o
  # projeto nao tem cota nesta regiao, e a recusa e silenciosa do lado do
  # gatilho: o push simplesmente nao gera build nenhum, sem erro em lugar
  # algum. Se a suite um dia deixar de caber, o caminho e consertar o peso ou
  # pedir cota — nunca voltar a fixar uma maquina paga por reflexo.
  # O build roda como 621901234263-compute@developer.gserviceaccount.com (a
  # conta default do projeto, que já tem Editor). Nesse modo o Cloud Build
  # recusa o build se o destino dos logs não for explícito. Os logs ficam no
  # Cloud Logging, não num bucket do GCS.
  logging: CLOUD_LOGGING_ONLY
