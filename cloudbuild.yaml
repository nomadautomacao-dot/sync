steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'NODE_OPTIONS=--max-old-space-size=4096', '-t', 'gcr.io/$PROJECT_ID/sync-app:${BUILD_ID}', '-t', 'gcr.io/$PROJECT_ID/sync-app:latest', '.']
    timeout: '1800s'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sync-app:${BUILD_ID}']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sync-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sync-app:${BUILD_ID}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '900'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'

# Store images
images:
  - 'gcr.io/$PROJECT_ID/sync-app:${BUILD_ID}'
  - 'gcr.io/$PROJECT_ID/sync-app:latest'
